<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      ;(function () {
        var base = '/Portfolio/'
        var path = window.location.pathname
        var rest = path.slice(base.length) || '/'
        var target =
          '/' + rest.replace(/^\/+/, '') + window.location.search + window.location.hash
        sessionStorage.setItem('spa:redirect', target)
        window.location.replace(base)
      })()
    </script>
  </head>
  <body></body>
</html>
